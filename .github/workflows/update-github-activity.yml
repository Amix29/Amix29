name: Update GitHub activity

on:
  schedule:
    - cron: "7/10 * * * *"
  workflow_dispatch:
  
permissions:
  contents: write

concurrency:
  group: update-github-activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Update activity numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_STATS_USER: Amix29
        run: python3 .github/scripts/update_github_activity.py

      - name: Commit changed numbers
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "GitHub Activity is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update GitHub activity"
          git push
